name: Test databrew guest comments

on:
  pull_request:
    paths:
      - now/index.html
      - now/comments-config.json
      - comments-api/**
      - tests/test_now_engagement.py
      - .github/workflows/test-guest-comments.yml
  push:
    branches: [main]
    paths:
      - now/index.html
      - now/comments-config.json
      - comments-api/**
      - tests/test_now_engagement.py
      - .github/workflows/test-guest-comments.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Worker API unit tests (mock D1 and Turnstile)
        working-directory: comments-api
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: NOW guest-comment interface regression
        run: |
          python -m unittest discover -s tests -p 'test_now_engagement.py' -v
          python -m unittest discover -s comments-api/tests -p 'test_provision.py' -v
