name: Sync Threads to databrew NOW

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: write

concurrency:
  group: databrew-now-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch owned Threads posts
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python scripts/sync_threads.py
      - name: Commit new feed only when it changed
        run: |
          if git diff --quiet -- now/threads.json; then
            echo "No new posts."
            exit 0
          fi
          git config user.name "databrew-now-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add now/threads.json
          git commit -m "chore(now): update public Threads feed"
          git push
