name: Build databrew NOW daily feed

on:
  push:
    branches: [main]
    paths:
      - scripts/build_now_activity.py
      - now/project-stories.json
      - now/story-summaries.json
      - articles.json
      - articles/**
      - now/index.html
      - tests/test_now_activity.py
      - tests/test_now_engagement.py
      - now/source-status.json
      - .github/workflows/build-now.yml
  workflow_dispatch:
  schedule:
    # Six staggered source checks daily, 01:23/05:23/09:23/13:23/17:23/21:23 KST.
    # The source observation date is NEVER replaced with the check time.
    - cron: "23 0,4,8,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: databrew-now-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify NOW adapters without network access
        run: python -m unittest discover -s tests -p 'test_now_activity.py' -v
      - name: Verify NOW per-article comments and sharing markup
        run: python -m unittest discover -s tests -p 'test_now_engagement.py' -v
      - name: Collect WATCH and project releases, including source-health report
        run: python scripts/build_now_activity.py
      - name: Commit new snapshots only if actually changed
        run: |
          if git diff --quiet -- now/activity.json now/source-status.json; then
            echo "No changes in NOW feed or source status."
            exit 0
          fi
          git config user.name "databrew-now-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add now/activity.json now/source-status.json
          git commit -m "chore(now): refresh source-dated WATCH and project feed"
          git pull --rebase origin main
          git push origin HEAD:main
