<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서비스에서 나온 기사 — databrew</title>
<meta name="description" content="databrew 서비스에서 나온 기사 모음.">
<link rel="canonical" href="https://raspos.github.io/databrew/articles/">
<link rel="alternate" hreflang="ko" href="https://raspos.github.io/databrew/articles/">
<link rel="alternate" hreflang="en" href="https://raspos.github.io/databrew/en/articles/">
<meta property="og:type" content="website"><meta property="og:site_name" content="databrew"><meta property="og:title" content="서비스에서 나온 기사 — databrew"><meta property="og:url" content="https://raspos.github.io/databrew/articles/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../../detail.css">
<style>.ar-wrap{max-width:900px;margin:0 auto;padding:44px max(16px,4vw) 70px}
.ar-wrap h1{font-size:clamp(28px,4.6vw,40px);letter-spacing:-.035em;line-height:1.2;margin:0 0 6px}
.ar-kicker{font:12px var(--font-mono);letter-spacing:.16em;color:var(--accent);margin:0 0 6px}
.bd-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:20px 0 10px}
.bd-bar p{margin:0;color:var(--muted);font-size:13px}
.bd-bar input{border:1px solid var(--rule);background:var(--cell);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;min-width:220px}
.bd-bar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bd{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);font-size:14px;background:var(--cell)}
.bd th{font-size:12px;font-weight:600;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--rule);text-align:center;white-space:nowrap}
.bd td{padding:11px 8px;border-bottom:1px solid var(--rule);vertical-align:top;text-align:center;color:var(--muted);font-size:13px}
.bd td.bd-t,.bd th.bd-t{text-align:left}
.bd td.bd-t{color:var(--ink);font-size:15px;line-height:1.5}
.bd td.bd-t a{color:var(--ink);font-weight:600;text-decoration:none}.bd td.bd-t a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.bd-tag{color:var(--accent);font-weight:700}
.bd-sum{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bd-m{display:none;margin:3px 0 0;font-size:12px;color:var(--muted)}
.bd-n{width:56px;font-variant-numeric:tabular-nums}.bd-by{width:96px}.bd-d{width:104px;white-space:nowrap;font-variant-numeric:tabular-nums}.bd-v{width:64px;font-variant-numeric:tabular-nums}
.bd-empty{padding:36px 8px!important;color:var(--muted)}
.bd-pager{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:22px 0 0}
.bd-pager button{min-width:36px;height:36px;border:1px solid var(--rule);background:var(--cell);color:var(--ink);border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.bd-pager button[aria-current]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.bd-pager button:disabled{opacity:.4;cursor:default}
@media (max-width:640px){.bd th.bd-n,.bd td.bd-n,.bd th.bd-by,.bd td.bd-by,.bd th.bd-d,.bd td.bd-d{display:none}.bd-m{display:block}.bd-v{width:48px}.bd-bar input{min-width:0;width:100%}}</style>
</head>
<body>
<nav class="topnav">
  <a class="brand" href="../">←&nbsp; <strong>data</strong>brew</a>
  <span class="breadcrumb">서비스에서 나온 기사</span>
  <a class="lang-switch-detail" href="../en/articles/" hreflang="en" lang="en">English</a>
</nav>
<main class="ar-wrap">
  <p class="ar-kicker">STORIES · <span id="arCount">0</span></p>
  <h1>서비스에서 나온 기사</h1>
  <div class="bd-bar"><p>최신순</p><input id="bdQ" type="search" placeholder="제목·말머리·글쓴이 검색" aria-label="기사 검색" autocomplete="off"></div>
  <table class="bd">
    <thead><tr><th class="bd-n" scope="col">번호</th><th class="bd-t" scope="col">제목</th><th class="bd-by" scope="col">글쓴이</th><th class="bd-d" scope="col">날짜</th><th class="bd-v" scope="col">조회</th></tr></thead>
    <tbody id="bdBody"><tr><td class="bd-empty" colspan="5">불러오는 중…</td></tr></tbody>
  </table>
  <div class="bd-pager" id="bdPager"></div>
</main>
<footer class="foot">
  <a href="../">databrew</a>
  <span>독립 데이터저널리즘 프로젝트</span>
  <span>누적 방문 <b data-hub-views>–</b></span>
</footer>
<script>
(function () {
  var EN = document.documentElement.lang === 'en', UP = '../', ROOT = '../', PER = 15;
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fdate(d) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ''); if (!m) return ''; return EN ? MON[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : m[1] + '.' + m[2] + '.' + m[3]; }
  function pick(a, k) { return (EN && a.en && a.en[k]) || a[k] || ''; }
  var body = document.getElementById('bdBody'), pager = document.getElementById('bdPager'), cnt = document.getElementById('arCount'), qi = document.getElementById('bdQ');
  var names = {}, rows = [], page = 1, q = '';
  function pvKey(id) { return 'databrew_pv_articles_' + String(id).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
  function msg(t) { body.textContent = ''; var tr = document.createElement('tr'), td = document.createElement('td'); td.colSpan = 5; td.className = 'bd-empty'; td.textContent = t; tr.appendChild(td); body.appendChild(tr); pager.textContent = ''; }
  function title(a) {
    var ext = /^https?:/i.test(a.url), h = document.createElement('a'), tg = pick(a, 'tag'), frag = document.createDocumentFragment();
    if (a.tagAuto && a.project && names[a.project]) tg = names[a.project];
    if (tg) { var s = document.createElement('span'); s.className = 'bd-tag'; s.textContent = '[' + tg + '] '; frag.appendChild(s); }
    h.href = ext ? a.url : ROOT + a.url; h.textContent = pick(a, 'title') + (ext ? ' ↗' : ''); if (ext) { h.target = '_blank'; h.rel = 'noopener'; }
    frag.appendChild(h); return frag;
  }
  function render() {
    var f = rows.filter(function (a) { if (!q) return true; var hay = [pick(a, 'title'), pick(a, 'tag'), pick(a, 'outlet'), pick(a, 'summary'), names[a.project] || ''].join(' ').toLowerCase(); return hay.indexOf(q) >= 0; });
    var pages = Math.max(1, Math.ceil(f.length / PER)); if (page > pages) page = pages; if (page < 1) page = 1;
    if (!f.length) return msg(EN ? 'No stories found.' : '검색 결과가 없습니다.');
    body.textContent = '';
    f.slice((page - 1) * PER, page * PER).forEach(function (a) {
      var tr = document.createElement('tr'), n = document.createElement('td'), t = document.createElement('td'), by = document.createElement('td'), d = document.createElement('td'), v = document.createElement('td');
      n.className = 'bd-n'; n.textContent = a._n; t.className = 'bd-t'; t.appendChild(title(a));
      var sum = pick(a, 'summary'); if (sum) { var p = document.createElement('p'); p.className = 'bd-sum'; p.textContent = sum; t.appendChild(p); }
      var m = document.createElement('p'); m.className = 'bd-m'; m.textContent = [pick(a, 'outlet'), fdate(a.date)].filter(Boolean).join(' · '); t.appendChild(m);
      by.className = 'bd-by'; by.textContent = pick(a, 'outlet'); d.className = 'bd-d'; d.textContent = fdate(a.date); v.className = 'bd-v'; v.textContent = '–'; v.setAttribute('data-id', /^articles\//.test(a.url) ? a.id : '');
      [n, t, by, d, v].forEach(function (c) { tr.appendChild(c); }); body.appendChild(tr);
    });
    body.querySelectorAll('td.bd-v').forEach(function (td) { var id = td.getAttribute('data-id'); if (!id) return; fetch('https://countapi.mileshilliard.com/api/v1/get/' + pvKey(id), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : { value: 0 }; }).then(function (j) { if (typeof j.value === 'number') td.textContent = j.value.toLocaleString('en-US'); }).catch(function () {}); });
    pager.textContent = '';
    if (pages > 1) {
      var mk = function (label, p, cur, dis) { var b = document.createElement('button'); b.type = 'button'; b.textContent = label; if (cur) b.setAttribute('aria-current', 'page'); if (dis) b.disabled = true; b.onclick = function () { page = p; try { history.replaceState(null, '', p > 1 ? '#' + p : location.pathname); } catch (e) {} render(); window.scrollTo(0, 0); }; pager.appendChild(b); };
      mk('‹', page - 1, false, page === 1);
      for (var i = 1; i <= pages; i++) mk(String(i), i, i === page, false);
      mk('›', page + 1, false, page === pages);
    }
  }
  fetch(UP + 'index.html', { cache: 'no-cache' }).then(function (r) { return r.text(); }).then(function (t) {
    var re = /<a class="card-inner" href="projects\/([^\/"]+)\/">[\s\S]*?<h3>([\s\S]*?)<\/h3>/g, m;
    while ((m = re.exec(t))) names[m[1]] = m[2].replace(/<[^>]+>/g, '').trim();
  }).catch(function () {}).then(function () { return fetch(ROOT + 'articles.json', { cache: 'no-cache' }); })
  .then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (all) {
    all = (Array.isArray(all) ? all : []).filter(function (a) { return a && (/^https?:\/\//i.test(a.url || '') || /^articles\/[\w-]+\/$/.test(a.url || '')) && pick(a, 'title'); })
      .sort(function (x, y) { return String(y.date || '').localeCompare(String(x.date || '')); });
    all.forEach(function (a, i) { a._n = all.length - i; });
    rows = all; cnt.textContent = all.length;
    var h = parseInt((location.hash || '').slice(1), 10); if (h > 0) page = h;
    if (!all.length) return msg(EN ? 'No stories yet.' : '아직 기사가 없습니다.');
    render();
  }).catch(function () { msg(EN ? 'Could not load the stories.' : '기사를 불러오지 못했습니다.'); });
  qi.addEventListener('input', function () { q = qi.value.trim().toLowerCase(); page = 1; render(); });
})();
</script>
<script src="../../detail.js" defer></script>
</body>
</html>
