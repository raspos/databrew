name: Build databrew NOW daily feed

on:
  push:
    branches: [main]
    paths:
      - scripts/build_now_activity.py
      - now/project-stories.json
      - now/index.html
      - tests/test_now_activity.py
      - .github/workflows/build-now.yml
  workflow_dispatch:
  schedule:
    # Two passes pick up early apartment figures and evening market close releases.
    # 09:35 KST and 21:35 KST; sources keep their own source observation dates.
    - cron: "35 0,12 * * *"

permissions:
  contents: write

concurrency:
  group: databrew-now-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify NOW adapters without network access
        run: python -m unittest discover -s tests -p 'test_now_activity.py' -v
      - name: Collect WATCH, project and Seoul apartment public releases
        run: python scripts/build_now_activity.py
      - name: Commit new snapshots only if actually changed
        run: |
          if git diff --quiet -- now/activity.json; then
            echo "No changes in NOW feed."
            exit 0
          fi
          git config user.name "databrew-now-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add now/activity.json
          git commit -m "chore(now): refresh source-dated WATCH and project feed"
          git pull --rebase origin main
          git push origin HEAD:main
