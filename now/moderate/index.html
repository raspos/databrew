<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>NOW 댓글 관리 | databrew</title>
<style>
:root{color-scheme:light dark;--bg:#f6f2ea;--paper:#fff;--text:#25201a;--muted:#70685d;--line:#d9d1c5;--accent:#8a4b1c}
@media(prefers-color-scheme:dark){:root{--bg:#1b1814;--paper:#28231d;--text:#efe7de;--muted:#b5a794;--line:#4c4238;--accent:#f0b17c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif}
main{max-width:860px;margin:auto;padding:24px 19px 70px}a{color:inherit}.back{font-size:13px;text-decoration:none;color:var(--accent);font-weight:650}
h1{font-size:clamp(26px,6vw,38px);letter-spacing:-.045em;margin:22px 0 8px}.intro{color:var(--muted);margin:0 0 22px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:20px;margin:0 0 20px}
label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}input{display:block;width:100%;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:10px 12px;min-height:45px}
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0 0}button{cursor:pointer;font:inherit;font-weight:650;border:1px solid var(--line);border-radius:8px;color:var(--text);background:var(--paper);padding:8px 13px;min-height:42px}
button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button:disabled{opacity:.5;cursor:wait}.primary{background:var(--text);border-color:var(--text);color:var(--paper)}.tabs button[aria-pressed=true]{background:var(--text);color:var(--paper)}
.state{min-height:22px;color:var(--muted);font-size:13px;margin:13px 0 0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.entry{padding:18px 0;border-top:1px solid var(--line)}.entry:first-child{border-top:0}.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.meta strong{color:var(--text)}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 12px}
.entry a{font-size:12px;color:var(--accent)}.empty{color:var(--muted);margin:12px 0}.warning{color:var(--accent);font-size:13px;margin:12px 0 0}
@media(max-width:570px){main{padding-top:16px}.card{padding:16px}.tabs{gap:5px}.tabs button{padding:8px 10px;font-size:13px}}
</style>
</head>
<body>
<main>
<a class="back" href="../">← databrew NOW</a>
<h1>댓글 관리</h1>
<p class="intro">비회원 댓글을 검토하고 승인·반려·삭제합니다. 비밀번호 대신 별도의 관리자 토큰으로 접근합니다.</p>
<section class="card">
 <label for="adminToken">관리자 토큰 (GitHub Actions Secret에 설정한 값)</label>
 <input type="password" id="adminToken" autocomplete="off" spellcheck="false" placeholder="DATABREW_COMMENTS_ADMIN_TOKEN">
 <div class="row">
  <button class="primary" id="connect" type="button">댓글 불러오기</button>
  <button id="disconnect" type="button">연결 해제</button>
 </div>
 <p class="warning">토큰은 이 페이지가 열린 동안에만 메모리에 보관되며 서버나 브라우저 저장소에 저장하지 않습니다. 다른 사람과 공유하지 마세요.</p>
 <p id="status" class="state" role="status" aria-live="polite"></p>
</section>
<section class="card" aria-label="댓글 목록">
 <div class="row tabs" role="group" aria-label="상태별 댓글">
  <button type="button" data-status="pending" aria-pressed="true">승인 대기</button>
  <button type="button" data-status="approved" aria-pressed="false">승인 완료</button>
  <button type="button" data-status="rejected" aria-pressed="false">반려</button>
  <button type="button" id="refresh">새로고침</button>
 </div>
 <div id="items"><p class="empty">관리자 토큰을 입력하면 댓글을 확인할 수 있습니다.</p></div>
</section>
</main>
<script>
(function(){
'use strict';
var api='',token='',filter='pending',busy=false;
var status=document.getElementById('status'),items=document.getElementById('items');
var tokenField=document.getElementById('adminToken');
function el(tag,cls,content){var node=document.createElement(tag);if(cls)node.className=cls;if(content!==undefined)node.textContent=String(content);return node}
var config=fetch('../comments-config.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('설정 파일 없음');return r.json()}).then(function(x){
  if(!x||typeof x.api_base!=='string'||!x.api_base.startsWith('https://'))throw Error('댓글 서비스 미연결');
  api=x.api_base.replace(/\/$/,'');
}).catch(function(){status.textContent='Cloudflare 댓글 API가 아직 배포되지 않았습니다.'});
function linkFor(key){
  var m=/^(watch|stories|projects):(.+)$/.exec(String(key||''));
  if(!m)return '../';
  var url=new URL('../',location.href);
  url.searchParams.set('filter',m[1]);
  url.searchParams.set('item',m[2]);
  return url.href;
}
function setBusy(value){
  busy=value;
  document.querySelectorAll('button').forEach(function(b){b.disabled=value});
}
function draw(rows){
  items.replaceChildren();
  if(!rows.length){items.appendChild(el('p','empty','해당 상태의 댓글이 없습니다.'));return}
  rows.forEach(function(row){
    var block=el('article','entry'),meta=el('div','meta');
    meta.append(el('strong','',row.nickname||'독자'),el('span','',row.post_key||''),el('time','',row.created_at||''));
    var body=el('p','body',row.content||''),link=el('a','','NOW 원문 보기 ↗');
    link.href=linkFor(row.post_key);link.target='_blank';link.rel='noopener noreferrer';
    var actions=el('div','actions');
    function action(name,code){
      var button=el('button','',name);button.type='button';
      button.addEventListener('click',function(){
        if(code==='delete'&&!confirm('이 댓글을 영구 삭제할까요?'))return;
        update(row.id,code);
      });actions.appendChild(button);
    }
    if(row.status!=='approved')action('승인','approve');
    if(row.status!=='rejected')action('반려','reject');
    action('영구 삭제','delete');
    block.append(meta,body,link,actions);items.appendChild(block);
  });
}
async function fetchJSON(path,options){
  if(!api||!token)throw Error('댓글 서비스 주소와 관리자 토큰이 필요합니다.');
  var opts=options||{};
  opts.headers={'Authorization':'Bearer '+token,...(opts.headers||{})};
  var response=await fetch(api+path,opts);
  var json=await response.json().catch(function(){return {}});
  if(!response.ok)throw Error(response.status===401?'관리자 토큰이 올바르지 않습니다.':json.error||'API 요청 실패 ('+response.status+')');
  return json;
}
async function list(){
  if(busy)return;
  await config;
  if(!api){status.textContent='댓글 API가 아직 연결되지 않았습니다.';return;}
  if(!token){status.textContent='관리자 토큰을 입력해 주세요.';return;}
  setBusy(true);status.textContent='댓글을 읽는 중입니다.';
  try{
    var json=await fetchJSON('/api/admin/comments?status='+encodeURIComponent(filter));
    draw(Array.isArray(json.comments)?json.comments:[]);
    status.textContent='댓글 목록을 불러왔습니다.';
  }catch(error){status.textContent=error.message;items.replaceChildren(el('p','empty','댓글을 표시할 수 없습니다.'))}
  finally{setBusy(false)}
}
async function update(id,action){
  if(busy||!token)return;
  setBusy(true);status.textContent='댓글을 처리하는 중입니다.';
  try{
    await fetchJSON('/api/admin/comments/'+encodeURIComponent(id),{
      method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action})
    });
    status.textContent='처리 완료';setBusy(false);await list();
  }catch(error){status.textContent=error.message;setBusy(false)}
}
document.getElementById('connect').addEventListener('click',function(){
  token=tokenField.value.trim();tokenField.value='';list();
});
document.getElementById('disconnect').addEventListener('click',function(){
  token='';tokenField.value='';items.replaceChildren(el('p','empty','연결이 해제됐습니다.'));
  status.textContent='관리자 인증 정보가 메모리에서 비워졌습니다.';
});
document.getElementById('refresh').addEventListener('click',list);
document.querySelectorAll('[data-status]').forEach(function(b){
  b.addEventListener('click',function(){
    filter=b.dataset.status;
    document.querySelectorAll('[data-status]').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))});
    list();
  });
});
})();
</script>
</body>
</html>
